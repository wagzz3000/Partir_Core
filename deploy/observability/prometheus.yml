global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Loki
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  # Partir Core Services
  # Even if CLI-only today, stub these for future use
  - job_name: partir-alpha
    static_configs:
      - targets: ['alpha:8080']

  - job_name: partir-beta
    static_configs:
      - targets: ['beta:8080']

  - job_name: partir-foundry
    static_configs:
      - targets: ['foundry:8080']

  - job_name: partir-omega
    static_configs:
      - targets: ['omega:8080']
