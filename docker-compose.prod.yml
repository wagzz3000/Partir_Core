# Partir Core - Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ─────────────────────────────────────────────────────────────
  # Core Services
  # ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_DB: ${PARTIR_DB_NAME:-partir}
      POSTGRES_USER: ${PARTIR_DB_USER:-partir}
      POSTGRES_PASSWORD: ${PARTIR_DB_PASSWORD:?PARTIR_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432" # Only localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PARTIR_DB_USER:-partir}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - partir-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - partir-net

  # ─────────────────────────────────────────────────────────────
  # Observability Stack
  # ─────────────────────────────────────────────────────────────

  alloy:
    image: grafana/alloy:v1.5.0
    restart: always
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    volumes:
      - ./deploy/observability/alloy.yaml:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - partir-net

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
    networks:
      - partir-net

  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - partir-net

  loki:
    image: grafana/loki:3.1.1
    restart: always
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - partir-net

  # ─────────────────────────────────────────────────────────────
  # Partir Core (optional - run CLIs directly on host)
  # ─────────────────────────────────────────────────────────────

  partir-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      PARTIR_DB_URL: postgres://${PARTIR_DB_USER:-partir}:${PARTIR_DB_PASSWORD}@postgres:5432/${PARTIR_DB_NAME:-partir}?sslmode=disable
      PARTIR_MINIO_ENDPOINT: minio:9000
      PARTIR_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      PARTIR_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4318
      PARTIR_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - partir-net
    profiles:
      - tools # Only start with: docker-compose --profile tools up

  # ─────────────────────────────────────────────────────────────
  # Worker Infrastructure
  # ─────────────────────────────────────────────────────────────

  nats:
    image: nats:2.10.22-alpine
    restart: always
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: [ "--jetstream", "--store_dir=/data", "-m", "8222" ]
    volumes:
      - nats_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8222/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - partir-net

  falkordb:
    image: falkordb/falkordb:v4.2.1
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - partir-net

  # ─────────────────────────────────────────────────────────────
  # StarRocks (Chrono) — Shared OLAP Engine (12 schemas)
  # ─────────────────────────────────────────────────────────────

  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3-latest
    restart: always
    ports:
      - "127.0.0.1:9030:9030" # MySQL protocol
      - "127.0.0.1:8030:8030" # HTTP
    volumes:
      - starrocks_fe_data:/opt/starrocks/fe/meta
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8030/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - partir-net

  starrocks-be:
    image: starrocks/be-ubuntu:3.3-latest
    restart: always
    ports:
      - "127.0.0.1:8040:8040"
    volumes:
      - starrocks_be_data:/opt/starrocks/be/storage
    environment:
      - FE_HOST=starrocks-fe
    depends_on:
      starrocks-fe:
        condition: service_healthy
    networks:
      - partir-net

  # ─────────────────────────────────────────────────────────────
  # Ollama Pool (elastic, GPU-pinned)
  # ─────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:0.5.4
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - partir-net
    # Post-deploy: docker exec -it partir-core-ollama-1 ollama pull mistral:7b
    # Scale with: docker compose up --scale ollama=N (each gets its own GPU via gpu.yml override)

    # ─────────────────────────────────────────────────────────────
    # Orchestrator Workers (Alpha, Beta, Omega)
    # ─────────────────────────────────────────────────────────────

  alpha-worker:
    build:
      context: ../Partir_Plugins/partir-plugin-worker
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8091:8090"
    environment:
      PORT: 8090
      WORKER_TYPE: alpha
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://ollama:11434
      MODEL: mistral:7b
      REGISTRY_DSN: postgres://${PARTIR_DB_USER:-partir}:${PARTIR_DB_PASSWORD}@postgres:5432/${PARTIR_DB_NAME:-partir}?sslmode=disable
      STARROCKS_DSN: root:@tcp(starrocks-fe:9030)/
      FALKORDB_ADDR: falkordb:6379
    depends_on:
      nats:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      starrocks-fe:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - partir-net

  beta-worker:
    build:
      context: ../Partir_Plugins/partir-plugin-worker
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8092:8090"
    environment:
      PORT: 8090
      WORKER_TYPE: beta
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://ollama:11434
      MODEL: mistral:7b
      REGISTRY_DSN: postgres://${PARTIR_DB_USER:-partir}:${PARTIR_DB_PASSWORD}@postgres:5432/${PARTIR_DB_NAME:-partir}?sslmode=disable
      STARROCKS_DSN: root:@tcp(starrocks-fe:9030)/
      FALKORDB_ADDR: falkordb:6379
    depends_on:
      nats:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      starrocks-fe:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - partir-net

  omega-worker:
    build:
      context: ../Partir_Plugins/partir-plugin-worker
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8093:8090"
    environment:
      PORT: 8090
      WORKER_TYPE: omega
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://ollama:11434
      MODEL: mistral:7b
      REGISTRY_DSN: postgres://${PARTIR_DB_USER:-partir}:${PARTIR_DB_PASSWORD}@postgres:5432/${PARTIR_DB_NAME:-partir}?sslmode=disable
      STARROCKS_DSN: root:@tcp(starrocks-fe:9030)/
      FALKORDB_ADDR: falkordb:6379
    depends_on:
      nats:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      starrocks-fe:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - partir-net

  foundry-worker:
    build:
      context: ../Partir_Plugins/partir-plugin-worker
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8094:8090"
    environment:
      PORT: 8090
      WORKER_TYPE: foundry
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://ollama:11434
      MODEL: mistral:7b
      REGISTRY_DSN: postgres://${PARTIR_DB_USER:-partir}:${PARTIR_DB_PASSWORD}@postgres:5432/${PARTIR_DB_NAME:-partir}?sslmode=disable
    # No volume — stateless. Writes to Ledger only.
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - partir-net

networks:
  partir-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nats_data:
  falkordb_data:
  ollama_data:
  starrocks_fe_data:
  starrocks_be_data:
